name: Play internal testers

# 내부 테스트 테스터를 Google 그룹으로 설정 (그룹에 가입한 사람은 누구나 테스터)
on:
  workflow_dispatch:
    inputs:
      group:
        description: Google 그룹 이메일
        default: mytoilet-testers@googlegroups.com

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set testers
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GROUP: ${{ inputs.group }}
        run: |
          pip install -q google-auth requests
          python3 - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          cred = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["FIREBASE_SA"]), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          s = AuthorizedSession(cred)
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/kr.mytoilet.app/edits"
          edit = s.post(base).json()["id"]
          r = s.put(f"{base}/{edit}/testers/internal", json={"googleGroups": [os.environ["GROUP"]]})
          print(r.status_code, r.text); r.raise_for_status()
          r = s.post(f"{base}/{edit}:commit"); print(r.status_code, r.text); r.raise_for_status()
          EOF
