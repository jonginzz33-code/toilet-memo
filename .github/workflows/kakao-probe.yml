name: Kakao toilet probe

# 임시: 카카오 지도 '화장실' 검색이 공공데이터에 없는 곳을 얼마나 채우는지 확인 (읽기만)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          curl -sSL -o p.gz https://github.com/jonginzz33-code/toilet-memo/releases/download/public-data/public-toilets.json.gz
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, gzip, math, os
          k = os.environ["KAKAO_REST_KEY"]
          pub = json.loads(gzip.decompress(open("p.gz", "rb").read()))["items"]
          def near(la, lo):
              c = [math.hypot((p["lat"]-la)*111000, (p["lon"]-lo)*88000) for p in pub if abs(p["lat"]-la) < 0.01 and abs(p["lon"]-lo) < 0.01]
              return int(min(c)) if c else 9999
          for (x, y) in ((126.845, 37.318), (126.9779, 37.5663), (126.93, 37.36)):
              docs = []
              for page in (1, 2, 3):
                  u = "https://dapi.kakao.com/v2/local/search/keyword.json?" + urllib.parse.urlencode(dict(query="화장실", x=x, y=y, radius=1500, sort="distance", page=page))
                  r = json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"Authorization": "KakaoAK " + k})).read())
                  docs += r["documents"]
                  if r["meta"]["is_end"]: break
              inpub = sum(1 for p in pub if math.hypot((p["lat"]-y)*111000, (p["lon"]-x)*88000) < 1500)
              print(f"== {x},{y}: kakao total {r['meta']['total_count']} got {len(docs)} / public data within 1.5km {inpub}")
              for d in docs:
                  print(d["distance"], d["place_name"], "|", d["category_name"], "| 공공데이터 최근접 %dm" % near(float(d["y"]), float(d["x"])))
          PY
