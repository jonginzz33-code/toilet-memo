name: Parking probe

# 임시: 충전소 API 조건 확인 (읽기만)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=fa4fc859cd80c582d1cbf58943b918023182ed5d6e5f8d2f00b40dfdbcc0e9da
          B=https://apis.data.go.kr/B552584/EvCharger
          echo "== 전국 충전기 수"; curl -sS -m 90 "$B/getChargerInfo?serviceKey=$K&pageNo=1&numOfRows=1&dataType=JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('totalCount'))"
          echo "== statId 조건"; curl -sS -m 90 "$B/getChargerInfo?serviceKey=$K&pageNo=1&numOfRows=20&statId=ME174013&dataType=JSON" | python3 -c "import sys,json;d=json.load(sys.stdin);it=d.get('items',{}).get('item',[]);print(d.get('totalCount'),[ (x['statId'],x['chgerId'],x['chgerType'],x['stat'],x.get('output')) for x in it][:10])"
          echo "== zscode 조건(안산 단원 41273)"; time curl -sS -m 120 "$B/getChargerInfo?serviceKey=$K&pageNo=1&numOfRows=9999&zscode=41273&dataType=JSON" -o z.json; ls -la z.json; python3 -c "import json;d=json.load(open('z.json'));print('total',d.get('totalCount'),'got',len(d['items']['item']))"
          echo "== 9999줄 한 번"; time curl -sS -m 180 "$B/getChargerInfo?serviceKey=$K&pageNo=1&numOfRows=9999&dataType=JSON" -o a.json; ls -la a.json
          echo "== 주차장 9999"; time curl -sS -m 180 "https://api.data.go.kr/openapi/tn_pubr_prkplce_info_api?serviceKey=$K&pageNo=1&numOfRows=1000&type=json" -o p.json; python3 -c "import json;d=json.load(open('p.json'));print(d['response' if 'response' in d else 'body'] if 0 else len(d['body']['items']['item'] if isinstance(d['body']['items'],dict) else d['body']['items']))"
