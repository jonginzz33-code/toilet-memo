name: Pharmacy probe

# 임시: 약국 API 확인 (읽기만)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=fa4fc859cd80c582d1cbf58943b918023182ed5d6e5f8d2f00b40dfdbcc0e9da
          B=https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService
          echo "== 목록"; curl -sS -m 90 "$B/getParmacyListInfoInqire?serviceKey=$K&pageNo=1&numOfRows=1&_type=json" | head -c 1500; echo
          echo "== 1000줄"; curl -sS -m 120 "$B/getParmacyListInfoInqire?serviceKey=$K&pageNo=1&numOfRows=1000&_type=json" -o a.json; ls -la a.json; head -c 200 a.json; echo
