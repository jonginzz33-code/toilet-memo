name: Firebase add SHA

# Play 앱 서명(실제 서명) SHA-1 을 Firebase 에 등록 (구글 로그인용). 여러 번 돌려도 같음
on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          s = AuthorizedSession(service_account.Credentials.from_service_account_info(
              json.loads(os.environ["FIREBASE_SA"]), scopes=["https://www.googleapis.com/auth/cloud-platform"]))
          app = "projects/my-toilet-ce481/androidApps/1:994060179309:android:22272bd7951941b8656c64"
          have = [c.get("shaHash", "").lower() for c in s.get(f"https://firebase.googleapis.com/v1beta1/{app}/sha").json().get("certificates", [])]
          # V3.0 서명(지금 폰들), V3.2 서명(안드로이드 17 이후)
          for sha in ("907db719d587f0dfd9db657960c3c7e7b724c089", "3944848d8390950587be1e021392398e8129e69d"):
              if sha in have:
                  print("already", sha); continue
              r = s.post(f"https://firebase.googleapis.com/v1beta1/{app}/sha", json={"shaHash": sha, "certType": "SHA_1"})
              print("add", sha, r.status_code); r.raise_for_status()
          PY
