name: Firebase add SHA

# 한 번만: Play 앱 서명 SHA-1 을 Firebase 안드로이드 앱에 등록 (구글 로그인용)
on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          s = AuthorizedSession(service_account.Credentials.from_service_account_info(
              json.loads(os.environ["FIREBASE_SA"]), scopes=["https://www.googleapis.com/auth/cloud-platform"]))
          app = "projects/my-toilet-ce481/androidApps/1:994060179309:android:22272bd7951941b8656c64"
          sha = "4af3c4ab073b85103c28a13f43ec33b354133a0b"
          r = s.get(f"https://firebase.googleapis.com/v1beta1/{app}/sha")
          print("list", r.status_code, r.text[:400].replace("{", "(").replace("}", ")"))
          have = [c.get("shaHash", "").lower() for c in (r.json().get("certificates", []) if r.ok else [])]
          if sha not in have:
              r = s.post(f"https://firebase.googleapis.com/v1beta1/{app}/sha", json={"shaHash": sha, "certType": "SHA_1"})
              print("add", r.status_code, r.text[:400].replace("{", "(").replace("}", ")")); r.raise_for_status()
          else:
              print("already there")
          PY
