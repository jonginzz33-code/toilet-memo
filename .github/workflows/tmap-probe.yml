name: Tmap probe

# 임시: 티맵 키가 어떤 이름으로 들어 있는지, 화장실 장소 검색이 되는지 확인 (읽기만)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          K1: ${{ secrets.TMAP_KEY }}
          K2: ${{ secrets.TMAP_APP_KEY }}
          K3: ${{ secrets.TMAP_APPKEY }}
          K4: ${{ secrets.TMAP_API_KEY }}
          K5: ${{ secrets.TMAP }}
          K6: ${{ secrets.SK_KEY }}
          K7: ${{ secrets.SKT_KEY }}
          K8: ${{ secrets.TMAPKEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          k = os.environ["K1"].strip()
          def get(path, **q):
              u = "https://apis.openapi.sk.com" + path + "?" + urllib.parse.urlencode(dict(version=1, **q))
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={"appKey": k, "Accept": "application/json"}), timeout=30) as r:
                      return json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  return {"err": e.code, "body": e.read()[:150].decode("utf-8", "replace").replace("{", "(").replace("}", ")")}
          def show(tag, d, n=12):
              if "err" in d: print(tag, "HTTP", d["err"], d["body"]); return
              sp = d.get("searchPoiInfo", {}); pois = sp.get("pois", {}).get("poi", []) if sp else []
              print(tag, "total", sp.get("totalCount") if sp else None, "got", len(pois))
              for p in pois[:n]:
                  print("   ", p.get("name"), "|", p.get("middleBizName"), ">", p.get("lowerBizName"), ">", p.get("detailBizName"))
          for kw in ("공중화장실", "개방화장실", "화장실"):
              show("전국 " + kw, get("/tmap/pois", searchKeyword=kw, count=200, page=1), 5)
              show("안산 " + kw, get("/tmap/pois", searchKeyword=kw, centerLat=37.318, centerLon=126.845, radius=3, searchtypCd="R", count=50, page=1))
          for cat in ("공중화장실", "화장실", "개방화장실"):
              show("주변카테고리 " + cat, get("/tmap/pois/search/around", categories=cat, centerLat=37.318, centerLon=126.845, radius=3, count=50, page=1))
          PY
