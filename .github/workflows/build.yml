name: Build APK

on:
  push:
    branches: [ main ]
    # 앱과 상관없는 파일만 바뀌면 빌드 안 함
    paths-ignore:
      - firestore.rules
      - firebase.json
      - docs/mockups/**
      - scripts/**
      - CLAUDE.md
      - NEXT.md
      - .github/workflows/firestore-rules.yml
      - .github/workflows/public-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 사용자가 "만들어줘" 할 때만 빌드: 커밋 메시지에 [build] 가 있거나 직접 실행할 때
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fonts (Pretendard)
        run: |
          mkdir -p app/src/main/assets/fonts
          for w in Regular SemiBold Bold; do
            f=app/src/main/assets/fonts/Pretendard-$w.otf
            for u in \
              "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/public/static/Pretendard-$w.otf" \
              "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/public/static/Pretendard-$w.otf" \
              "https://unpkg.com/pretendard@1.3.9/dist/public/static/Pretendard-$w.otf"; do
              curl -fsSL -o "$f" "$u" && break || echo "try next: $u"
            done
            ls -la "$f" || echo "font $w skipped"
          done

      - name: Upload key (if set)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/upload.jks
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> $GITHUB_ENV
          fi

      - name: Check keys (length only)
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
        run: echo "KAKAO_KEY length = ${#KAKAO_KEY}"

      - name: Build
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: gradle assemblePersonalRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/personal/release/*.apk out/toilet-memo.apk
          cp app/build/outputs/bundle/playRelease/*.aab out/toilet-memo-play.aab
          echo "VC=$((GITHUB_RUN_NUMBER + 100))" >> $GITHUB_ENV
          echo "VN=$(grep -oE '^## v[0-9][0-9.]*' README.md | tail -1 | sed 's/## //')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: toilet-memo
          path: out/*

      - name: Release (fixed APK link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VC }}
          name: ${{ env.VN }} (build ${{ env.VC }})
          body: "versionCode=${{ env.VC }}"
          make_latest: true
          files: |
            out/toilet-memo.apk
            out/toilet-memo-play.aab
