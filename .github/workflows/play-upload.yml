name: Play internal upload

# 빌드가 끝나면 최신 .aab 를 Play 내부 테스트에 자동으로 올림
# (비밀값 FIREBASE_SA 의 서비스 계정이 Play Console '사용자 및 권한'에 초대돼 있어야 함)
on:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get latest .aab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'toilet-memo-play.aab' --dir out
          echo "VN=$(gh release view --repo "$GITHUB_REPOSITORY" --json name -q .name)" >> $GITHUB_ENV
          echo "VC=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | sed 's/build-//')" >> $GITHUB_ENV

      - name: Service account email (Play Console 에 초대할 주소)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: printf '%s' "$FIREBASE_SA" | jq -r .client_email

      - name: Upload to internal + closed testing
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os, urllib.parse
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          cred = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["FIREBASE_SA"]), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          s = AuthorizedSession(cred)
          pkg = "kr.mytoilet.app"
          base = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}/edits"

          def publish(tracks, closed_status="completed"):
              edit = s.post(base).json()["id"]
              with open("out/toilet-memo-play.aab", "rb") as f:
                  r = s.post(f"https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/{pkg}/edits/{edit}/bundles?uploadType=media",
                             data=f, headers={"Content-Type": "application/octet-stream"}, timeout=600)
              print("upload", r.status_code, r.text[:300])
              # 이미 올린 버전이면(다시 돌릴 때) 올린 걸 그대로 씀
              vc = os.environ["VC"] if r.status_code != 200 and "already" in r.text else (r.raise_for_status() or r.json()["versionCode"])
              for t in tracks:
                  r = s.put(f"{base}/{edit}/tracks/{urllib.parse.quote(t)}",
                            json={"track": t, "releases": [{"name": os.environ["VN"], "versionCodes": [str(vc)], "status": "completed" if t == "internal" else closed_status}]})
                  print(t, r.status_code, r.text[:300]); r.raise_for_status()
              r = s.post(f"{base}/{edit}:commit")
              print("commit", tracks, r.status_code, r.text[:600].replace("{", "(").replace("}", ")")); r.raise_for_status()

          # 내부 테스트 + 비공개 테스트(지인 테스트).
          # 앱이 첫 심사 전이면 비공개 쪽은 '초안'으로만 올릴 수 있음 → Play Console에서 '검토를 위해 앱 전송'을 눌러야 함
          for args in ((["internal", "지인 테스트"],), (["internal", "지인 테스트"], "draft"), (["internal"],)):
              try:
                  publish(*args); break
              except Exception as e:
                  print("failed", args, e)
          PY
