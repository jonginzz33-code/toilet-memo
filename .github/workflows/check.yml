name: Check code

# 앱 코드가 바뀌면 오류가 없는지만 검사 (설치 파일은 안 만듦, 릴리스 안 올림)
on:
  push:
    branches: [ main ]
    paths:
      - app/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile
        run: gradle compilePersonalReleaseKotlin --no-daemon
